name: Update Open Source Contributions

on:
  schedule:
    - cron: '17 2 * * *' # Runs nightly at 02:17 UTC (07:47 AM IST) - off-peak to avoid queue delay
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run contribution update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_contributions.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(readme): auto-update open-source contributions" && git push)
