[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-showcase"
version = "0.1.0"
description = "Automated open-source pull request showcase and ledger generator for GitHub Profiles."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Aayushyaash", email = "aayushyaash@gmail.com" }
]
keywords = ["github", "github-action", "profile-readme", "showcase", "open-source", "pull-requests"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
pr-showcase = "update_contributions:main"

[tool.setuptools.package-dir]
"" = "scripts"

[tool.setuptools]
py-modules = ["update_contributions"]
